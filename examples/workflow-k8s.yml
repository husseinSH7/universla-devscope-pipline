# Example GitHub Actions workflow for Kubernetes deployments
# This shows how to use the pipeline toolkit with Kubernetes

name: CI/CD Pipeline (Kubernetes)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  pipeline:
    name: DevSecOps Pipeline
    uses: your-username/pipeline-toolkit/.github/workflows/pipeline.yml@main
    with:
      # Use Kubernetes as deployment target
      deploy_target: 'k8s'
      
      # Severity gate for security scans
      severity_gate: 'HIGH'
      
      # Enable canary deployments for production
      enable_canary: true
      canary_percentage: '10%'
      
      # Enable SARIF reports in GitHub Security tab
      enable_sarif: true
      
      # Docker configuration
      dockerfile_path: './Dockerfile'
      build_context: '.'
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
      # Kubernetes deployment secrets
      kube_config: ${{ secrets.KUBE_CONFIG }}
      # Docker deployment secrets (not needed for k8s)
      # ssh_host: ${{ secrets.SSH_HOST }}
      # ssh_username: ${{ secrets.SSH_USERNAME }}
      # ssh_key: ${{ secrets.SSH_KEY }}
