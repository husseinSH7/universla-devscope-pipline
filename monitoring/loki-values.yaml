# Loki log aggregation configuration

loki:
  enabled: true
  persistence:
    enabled: true
    size: 20Gi
  
  config:
    chunk_store_config:
      max_look_back_period: 168h
      shared:
        store: inmemory
    
    table_manager:
      retention_deletes_enabled: true
      retention_period: 168h
    
    schema_config:
      configs:
        - from: 2024-01-01
          store: boltdb-shipper
          object_store: filesystem
          schema: v11
          index:
            prefix: index_
            period: 24h
    
    storage_config:
      boltdb_shipper:
        active_index_directory: /loki/index
        cache_location: /loki/cache
        shared_store: filesystem
      filesystem:
        directory: /loki/chunks
    
    limits_config:
      enforce_metric_name: false
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      max_streams_per_user: 0
      max_entries_limit: 5000
    
    server:
      http_listen_port: 3100
    
    ingester:
      lifecycler:
        ring:
          kvstore:
            store: inmemory
          replication_factor: 1
      chunk_idle_period: 5m
      chunk_retain_period: 30s
      max_transfer_retries: 0
    
    distributor:
      ring:
        kvstore:
          store: inmemory

# Promtail for log collection
promtail:
  enabled: true
  
  config:
    server:
      http_listen_port: 3101
    
    clients:
      - url: http://loki:3100/loki/api/v1/push
    
    scrape_configs:
      # Kubernetes pod logs
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
              - __meta_kubernetes_pod_label_app_kubernetes_io_instance
              - __meta_kubernetes_pod_node_name
              - __meta_kubernetes_namespace
              - __meta_kubernetes_pod_name
              - __meta_kubernetes_pod_ip
              - __meta_kubernetes_pod_uid
            target_label: __meta_composed_kubernetes_pod
            separator: /
            replacement: $1
            action: replace
          - source_labels:
              - __meta_composed_kubernetes_pod
            target_label: pod
            action: replace
          - source_labels:
              - __meta_kubernetes_pod_namespace
            target_label: namespace
            action: replace
          - source_labels:
              - __meta_kubernetes_pod_name
            target_label: pod_name
            action: replace
          - source_labels:
              - __meta_kubernetes_pod_node_name
            target_label: node
            action: replace
          - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_component
            target_label: component
            action: replace
          - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_instance
            target_label: instance
            action: replace
          - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_version
            target_label: version
            action: replace
          - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_part_of
            target_label: part_of
            action: replace
          - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_managed_by
            target_label: managed_by
            action: replace
          - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_created_by
            target_label: created_by
            action: replace
      
      # Kubernetes node logs
      - job_name: kubernetes-nodes
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels:
              - __meta_kubernetes_node_name
            target_label: node
            action: replace
          - source_labels:
              - __meta_kubernetes_node_name
            target_label: __host__
            action: replace
          - source_labels:
              - __meta_kubernetes_node_name
            target_label: nodename
            action: replace

# Grafana datasource configuration
grafana:
  enabled: true
  sidecar:
    datasources:
      enabled: true
      maxAge: 24h
  
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Loki
          type: loki
          access: proxy
          url: http://loki:3100
          isDefault: false
          editable: true
