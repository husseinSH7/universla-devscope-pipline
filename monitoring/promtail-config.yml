# Promtail configuration for collecting Docker logs

server:
  http_listen_port: 3101

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker container logs
  - job_name: docker-logs
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels:
          - __meta_docker_container_name
        regex: "/(.*)"
        target_label: container
        action: replace
      - source_labels:
          - __meta_docker_container_id
        target_label: container_id
        action: replace
      - source_labels:
          - __meta_docker_container_log_stream
        target_label: stream
        action: replace
      - source_labels:
          - __meta_docker_container_label_com_docker_compose_service
        target_label: service
        action: replace
      - source_labels:
          - __address__
        target_label: __address__
        action: replace
      - source_labels:
          - __meta_docker_container_name
        target_label: __meta_docker_container_name
        action: replace
      - source_labels:
          - __meta_docker_container_label_job
        target_label: job
        action: replace

  # System logs
  - job_name: system-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          __path__: /var/log/*log
