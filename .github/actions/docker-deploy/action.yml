name: 'Docker Deployment'
description: 'Deploy Docker containers via SSH to a VPS'

inputs:
  ssh_host:
    description: 'SSH host address'
    required: true
  ssh_username:
    description: 'SSH username'
    required: true
  ssh_key:
    description: 'SSH private key'
    required: true
  image_tag:
    description: 'Docker image tag to deploy'
    required: true
  environment:
    description: 'Environment name (staging/production)'
    required: true
  docker_compose_path:
    description: 'Path to docker-compose.yml on remote server'
    required: false
    default: '/opt/app/docker-compose.yml'
  app_name:
    description: 'Application name for container identification'
    required: false
    default: 'app'

outputs:
  url:
    description: 'Deployed application URL'
    value: ${{ steps.deploy.outputs.url }}

runs:
  using: 'composite'
  steps:
    - name: Setup SSH key
      shell: bash
      run: |
        mkdir -p ~/.ssh
        echo "${{ inputs.ssh_key }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H ${{ inputs.ssh_host }} >> ~/.ssh/known_hosts

    - name: Store current image tag
      shell: bash
      run: |
        ssh -i ~/.ssh/deploy_key ${{ inputs.ssh_username }}@${{ inputs.ssh_host }} \
          "echo ${{ inputs.image_tag }} > /opt/${{ inputs.app_name }}-${{ inputs.environment }}-current.tag"

    - name: Update docker-compose.yml with new image
      shell: bash
      run: |
        ssh -i ~/.ssh/deploy_key ${{ inputs.ssh_username }}@${{ inputs.ssh_host }} \
          "cd $(dirname ${{ inputs.docker_compose_path }}) && \
           sed -i 's|image:.*|image: ${{ inputs.image_tag }}|g' docker-compose.yml"

    - name: Pull new Docker image
      shell: bash
      run: |
        ssh -i ~/.ssh/deploy_key ${{ inputs.ssh_username }}@${{ inputs.ssh_host }} \
          "cd $(dirname ${{ inputs.docker_compose_path }}) && \
           docker compose pull"

    - name: Restart containers
      shell: bash
      run: |
        ssh -i ~/.ssh/deploy_key ${{ inputs.ssh_username }}@${{ inputs.ssh_host }} \
          "cd $(dirname ${{ inputs.docker_compose_path }}) && \
           docker compose up -d"

    - name: Clean up old images
      shell: bash
      run: |
        ssh -i ~/.ssh/deploy_key ${{ inputs.ssh_username }}@${{ inputs.ssh_host }} \
          "docker image prune -af --filter 'until=24h'"

    - name: Get deployment URL
      id: deploy
      shell: bash
      run: |
        if [ "${{ inputs.environment }}" = "staging" ]; then
          echo "url=https://staging.yourdomain.com" >> $GITHUB_OUTPUT
        else
          echo "url=https://yourdomain.com" >> $GITHUB_OUTPUT
        fi

    - name: Cleanup SSH key
      if: always()
      shell: bash
      run: |
        rm -f ~/.ssh/deploy_key
